app-id: dev.knoll.Oriel
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for bindgen (pipewire-sys)
  - org.freedesktop.Sdk.Extension.llvm22
command: oriel-client

finish-args:
  # Display / GPU
  - --socket=wayland
  - --device=dri
  - --share=ipc
  # QUIC to the remote server + ssh
  - --share=network
  # Audio: PipeWire (native) with PulseAudio fallback
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # SSH access for `oriel-client connect`
  - --socket=ssh-auth
  - --filesystem=~/.ssh:ro
  # Color scheme / settings portal
  - --talk-name=org.freedesktop.portal.Desktop
  # Spawn local host terminal emulators for remote PTY sessions, and run the host's
  # fusermount3 so files pasted from remote apps appear in a FUSE mount host apps can see
  - --talk-name=org.freedesktop.Flatpak
  # Read files copied in host apps that offer only file:// URIs, not a FileTransfer
  # portal key (Cosmic Files). Read-only; /usr, /etc and /tmp stay the sandbox's own.
  - --filesystem=host:ro
  # /dev/fuse, which the FUSE library opens before it hands mounting to fusermount3
  - --device=all

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  env:
    CARGO_HOME: /run/build/oriel/cargo
    CARGO_NET_OFFLINE: 'true'
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
  arch:
    aarch64:
      env:
        CARGO_BUILD_JOBS: '4'
        # The repo's .cargo/config.toml points at a cross linker; we build natively.
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc

modules:
  - name: oriel
    buildsystem: simple
    build-options:
      env:
        RUSTFLAGS: ''
        # flatpak-builder sets SOURCE_DATE_EPOCH to the current timestamp on every
        # run, which invalidates every cc-rs build script (ring, etc.).
        SOURCE_DATE_EPOCH: '1700000000'
    build-commands:
      - |
        set -e
        # Normalize vendored crate timestamps so Cargo does not re-run build.rs
        # and recompile C/C++ crates when flatpak-builder re-extracts sources.
        find "${CARGO_HOME}/vendor" -exec touch -h -d '2020-01-01T00:00:00Z' {} +
        cargo --offline build --release -p oriel-client
      - install -Dm755 "${CARGO_TARGET_DIR:-target}/release/oriel-client"
        /app/bin/oriel-client
      - install -Dm755 packaging/flatpak/fusermount3-wrapper.sh /app/bin/fusermount3
      - install -Dm644 packaging/flatpak/dev.knoll.Oriel.desktop
        /app/share/applications/dev.knoll.Oriel.desktop
      - install -Dm644 packaging/flatpak/dev.knoll.Oriel.metainfo.xml
        /app/share/metainfo/dev.knoll.Oriel.metainfo.xml
      - install -Dm644 packaging/flatpak/dev.knoll.Oriel.svg
        /app/share/icons/hicolor/scalable/apps/dev.knoll.Oriel.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - .git
          - .flatpak-builder
          - build-dir
          - repo
      - cargo-sources.json
