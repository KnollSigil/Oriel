name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libwayland-dev libxkbcommon-dev libgtk-4-dev libpipewire-0.3-dev libspa-0.2-dev libopus-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  build-aarch64-client:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libwayland-dev libxkbcommon-dev libgtk-4-dev libpipewire-0.3-dev libspa-0.2-dev libopus-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p remotewayland-client
