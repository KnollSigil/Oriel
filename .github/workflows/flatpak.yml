name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Install runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08 \
            org.freedesktop.Sdk.Extension.llvm22//26.08
      - name: Build
        run: ./scripts/build-flatpak.sh --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: dev.knoll.Oriel-${{ matrix.arch }}
          path: build/flatpak/dev.knoll.Oriel-${{ matrix.arch }}.flatpak
