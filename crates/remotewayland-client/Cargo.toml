[package]
name = "remotewayland-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gtk4"]
gtk4 = ["dep:gtk4"]
qt = ["dep:qtbridge", "dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
anyhow.workspace = true
clap.workspace = true
gtk4 = { version = "0.9", optional = true, features = ["v4_12"] }
qtbridge = { version = "0.4", optional = true }
libc.workspace = true
lz4_flex.workspace = true
opus.workspace = true
pipewire.workspace = true
quinn.workspace = true
remotewayland-proto.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smithay-client-toolkit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
