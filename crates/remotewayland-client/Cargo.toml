[package]
name = "remotewayland-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gtk4"]
gtk4 = ["dep:gtk4", "dep:adw"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
gtk4 = { version = "0.9", optional = true, features = ["v4_12"] }
# libadwaita 1.5 is the oldest supported (Ubuntu 24.04).
adw = { package = "libadwaita", version = "0.7", optional = true, features = ["v1_5"] }
libc.workspace = true
lz4_flex.workspace = true
opus.workspace = true
pipewire.workspace = true
quinn.workspace = true
remotewayland-proto.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smithay-client-toolkit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[lints]
workspace = true
