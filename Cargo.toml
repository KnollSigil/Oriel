[workspace]
resolver = "2"
members = [
    "crates/remotewayland-proto",
    "crates/remotewayland-server",
    "crates/remotewayland-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3"
bincode = "1.3"
bytemuck = { version = "1.18", features = ["derive"] }
bytes = "1.7"
calloop = "0.14"
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
pollster = "0.4"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop"] }
smithay-client-toolkit = "0.19"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
remotewayland-proto = { path = "crates/remotewayland-proto" }
